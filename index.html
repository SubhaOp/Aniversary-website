	    <style>\n
/* Responsive anniversary gallery: keep photos within the screen */
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
body { margin: 0; }
#imgTxt {
  width: 100%;
  max-width: 100vw;
  padding: 12px 16px;
  text-align: center;
}
#img {
  display: block;
  width: auto !important;
  height: auto !important;
  max-width: min(82vw, 560px) !important;
  max-height: 55vh !important;
  object-fit: contain;
  margin: 12px auto 0;
  border-radius: 12px;
}
#Txt, #tmp {
  display: inline-block;
  max-width: min(88vw, 700px);
  overflow-wrap: anywhere;
}
#content, #typeDiv, #heartTxt {
  max-width: 94vw;
  padding-left: 10px;
  padding-right: 10px;
}
#timer { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; }
canvas { max-width: 100vw; }
@media (max-width: 600px) {
  #img { max-width: 88vw !important; max-height: 48vh !important; }
  #Txt, #tmp { max-width: 90vw; }
}
\n    </style>\n</head>
